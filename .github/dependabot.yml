version: 2
updates:
- package-ecosystem: docker
  directories:
    - "/"
    - "/config/**/*"
    - "/actions/setup-sigstore-env"
  schedule:
    interval: weekly
  groups:
    docker-deps:
      patterns:
        - "*"

- package-ecosystem: gomod
  directories:
    - "/"
    - "/tools/*"
    - "/hack/"
    - "/hack/ct_server"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    go-deps:
      patterns:
        - "*"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  groups:
    action-deps:
      patterns:
        - "*"

