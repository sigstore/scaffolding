name: Release

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write
      contents: write

    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: on

    steps:
    - name: Check out code onto GOPATH
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        path: ./src/github.com/${{ github.repository }}
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ./src/github.com/${{ github.repository }}/go.work
        check-latest: true
        cache: false

    - name: Install ko
      uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        install-only: true

    - name: Log into ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get TAG
      id: get_tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Run goreleaser
      working-directory: ./src/github.com/${{ github.repository }}
      run: goreleaser release --clean --timeout 120m
      env:
        GIT_TAG: ${{ steps.get_tag.outputs.TAG }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-release-version:
    name: Open PR to bump default release version
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write       # push the bump branch
      pull-requests: write  # open the PR

    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: true # needed to push the bump branch

    - name: Bump RELEASE_VERSION in setup-scaffolding-from-release.sh
      id: bump
      run: |
        set -euo pipefail
        script=hack/setup-scaffolding-from-release.sh
        current=$(sed -n 's/^RELEASE_VERSION="\(.*\)"$/\1/p' "${script}")
        # Only move forward, e.g. not for a patch release cut from an older branch.
        if [[ "$(printf '%s\n%s\n' "${current}" "${TAG}" | sort -V | tail -1)" != "${TAG}" ]]; then
          echo "Default ${current} is already ahead of ${TAG}"
          exit 0
        fi
        # Same stamping the release applies to the published copy of the script;
        # it is a no-op for tags that aren't vX.Y.Z.
        make stamp-release-version GIT_TAG="${TAG}"
        if ! git diff --quiet -- "${script}"; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        TAG: ${{ github.ref_name }}

    - name: Open pull request
      if: steps.bump.outputs.changed == 'true'
      run: |
        set -euo pipefail
        branch="bump-release-version-${TAG}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "${branch}"
        git commit -s -am "Bump default release version to ${TAG}"
        git push --force origin "HEAD:refs/heads/${branch}"
        if [[ -z "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]]; then
          gh pr create --base main --head "${branch}" \
            --title "Bump default release version to ${TAG}" \
            --body "Updates the default \`RELEASE_VERSION\` in \`hack/setup-scaffolding-from-release.sh\` to ${TAG}. Merge after the ${TAG} draft release is published, otherwise the default points at assets that don't exist yet."
        fi
      env:
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
