name: Fulcio&Rekor E2E Tests Using Release

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash
    working-directory: ./

concurrency:
  group: fulcio-rekor-kind-using-release-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-release:
    name: build mock release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: on
      GOFLAGS: -ldflags=-s -ldflags=-w
      KO_DOCKER_REPO: registry.local:5000/knative
      KOCACHE: /home/runner/ko

    steps:
    - name: Check out our repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: ./src/github.com/sigstore/scaffolding
        persist-credentials: false

    - uses: chainguard-dev/actions/setup-mirror@f45211d3e8f9d2676c6b8cdd6a765435e06c819d # v1.6.13

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: 1.26.x
        check-latest: true

    - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ${{ env.KOCACHE }}
        key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.26.x-

    - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9

    - name: Start local registry for ko build
      run: |
        docker run -d -p "127.0.0.1:5000:5000" --name registry.local \
          -e REGISTRY_HTTP_ADDR=0.0.0.0:5000 registry:2
        if ! grep -q "registry.local" /etc/hosts; then
          echo "127.0.0.1 registry.local" | sudo tee -a /etc/hosts
        fi

    - name: Build release manifests and images
      working-directory: ./src/github.com/sigstore/scaffolding
      run: |
        make release-images \
          KO_DOCKER_REPO=registry.local:5000/knative \
          KO_PLATFORM=linux/amd64 \
          KO_EXTRA_FLAGS="--insecure-registry --sbom=none"

    - name: Stage mock release artifacts
      working-directory: ./src/github.com/sigstore/scaffolding
      run: |
        mkdir -p /tmp/mock-release
        cp release-*.yaml testrelease.yaml /tmp/mock-release/
        cp hack/setup-kind.sh hack/setup-scaffolding.sh hack/setup-scaffolding-from-release.sh /tmp/mock-release/
        docker exec registry.local tar -C /var/lib/registry -cf - . > /tmp/mock-release/registry-data.tar

    - name: Upload mock release
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mock-release
        path: /tmp/mock-release
        retention-days: 1

  fulcio-rekor-ctlog-tests-using-release:
    name: e2e tests using release
    needs: build-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false # Keep running if one leg fails.
      matrix:
        k8s-version:
          - v1.32.x
          - v1.33.x
          - v1.34.x
          - v1.35.x
        leg:
          - fulcio rekor ctlog e2e

    env:
      KO_DOCKER_REPO: registry.local:5000/knative
      KOCACHE: /home/runner/ko

    steps:
    - uses: chainguard-dev/actions/setup-mirror@f45211d3e8f9d2676c6b8cdd6a765435e06c819d # v1.6.13

    - name: Download mock release
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: mock-release
        path: /tmp/mock-release

    - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      with:
        cosign-release: v3.1.3

    - name: Checkout TSA for testing.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: sigstore/timestamp-authority
        path: ./src/github.com/sigstore/timestamp-authority
        persist-credentials: false

    # Use the Go version timestamp-cli needs; it is also used for ko below.
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ./src/github.com/sigstore/timestamp-authority/go.mod
        cache-dependency-path: ./src/github.com/sigstore/timestamp-authority/go.sum

    - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9

    - name: Setup Cluster
      uses: chainguard-dev/actions/setup-kind@f45211d3e8f9d2676c6b8cdd6a765435e06c819d # v1.6.13
      id: kind
      with:
        k8s-version: ${{ matrix.k8s-version }}
        registry-authority: registry.local:5000
        cluster-suffix: cluster.local
        service-account-issuer: https://kubernetes.default.svc.cluster.local

    - name: Populate local registry with mock release images
      run: |
        REG_CONTAINER=$(docker ps --filter publish=5000 --format '{{.Names}}')
        docker exec -i "${REG_CONTAINER}" tar -C /var/lib/registry -xf - < /tmp/mock-release/registry-data.tar
        docker restart "${REG_CONTAINER}"

    - name: Setup Knative
      uses: chainguard-dev/actions/setup-knative@f45211d3e8f9d2676c6b8cdd6a765435e06c819d # v1.6.13
      with:
        version: "1.18.x"
        serving-features: >
          {
            "kubernetes.podspec-fieldref": "enabled",
            "kubernetes.podspec-persistent-volume-claim": "enabled",
            "kubernetes.podspec-persistent-volume-write": "enabled"
          }

    - name: Install scaffolding
      timeout-minutes: 10
      run: |
        cp /tmp/mock-release/setup-scaffolding-from-release.sh /tmp/setup-scaffolding-from-release.sh
        chmod u+x /tmp/setup-scaffolding-from-release.sh
        /tmp/setup-scaffolding-from-release.sh --release-dir /tmp/mock-release

        # TODO(vaikas): Figure out how these could be exposed by above.
        REKOR_URL=$(kubectl -n rekor-system get ksvc rekor -ojsonpath='{.status.url}')
        FULCIO_URL=$(kubectl -n fulcio-system get ksvc fulcio -ojsonpath='{.status.url}')
        FULCIO_GRPC_URL=$(kubectl -n fulcio-system get ksvc fulcio-grpc -ojsonpath='{.status.url}')
        CTLOG_URL=$(kubectl -n ctlog-system get ksvc ctlog -ojsonpath='{.status.url}')
        TUF_MIRROR=$(kubectl -n tuf-system get ksvc tuf -ojsonpath='{.status.url}')
        TSA_URL=$(kubectl -n tsa-system get ksvc tsa -ojsonpath='{.status.url}')

        # Set the endopints
        echo "REKOR_URL=$REKOR_URL" >> $GITHUB_ENV
        echo "FULCIO_URL=$FULCIO_URL" >> $GITHUB_ENV
        echo "FULCIO_GRPC_URL=$FULCIO_GRPC_URL" >> $GITHUB_ENV
        echo "CTLOG_URL=$CTLOG_URL" >> $GITHUB_ENV
        echo "TUF_MIRROR=$TUF_MIRROR" >> $GITHUB_ENV
        echo "TSA_URL=$TSA_URL" >> $GITHUB_ENV

        # Make copy of the tuf root in the default namespace for tests
        kubectl -n tuf-system get secrets tuf-root -oyaml | sed 's/namespace: .*/namespace: default/' | kubectl create -f -

    - name: Create sample image
      run: |
        pushd $(mktemp -d)
        go mod init example.com/demo-with-release
        cat <<EOF > main.go
        package main
        import "fmt"
        func main() {
          fmt.Println("hello world")
        }
        EOF
        demoimage=`ko publish --insecure-registry -B example.com/demo-with-release`
        echo "demoimage=$demoimage" >> $GITHUB_ENV
        echo Created image $demoimage
        popd

    - name: Run test jobs on the cluster
      run: |
        kubectl apply -f /tmp/mock-release/testrelease.yaml
        kubectl wait --for=condition=Complete --timeout=240s job/sign-job
        kubectl wait --for=condition=Complete --timeout=240s job/verify-job

    - name: Get the issuer url endpoint on the cluster
      run: |
        ISSUER_URL=$(kubectl get ksvc gettoken -ojsonpath='{.status.url}')
        echo "ISSUER_URL=$ISSUER_URL" >> $GITHUB_ENV
        OIDC_TOKEN=$(curl -s $ISSUER_URL)
        echo "OIDC_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV

    - name: Initialize cosign with our TUF root
      run: cosign initialize --mirror ${TUF_MIRROR} --root ./root.json
      env:
        TUF_MIRROR: ${{ env.TUF_MIRROR }}

    - name: Create a signing config
      run: |
        cosign signing-config create \
          --fulcio=url=$FULCIO_URL,api-version=1,start-time=$(date -u --iso-8601=sec),operator=test \
          --rekor=url=$REKOR_URL,api-version=2,start-time=$(date -u --iso-8601=sec),operator=test \
          --rekor-config=ANY \
          --tsa=url=$TSA_URL/api/v1/timestamp,api-version=1,start-time=$(date -u --iso-8601=sec),operator=test \
          --tsa-config=ANY \
          --out signing_config.json
      env:
        FULCIO_URL: ${{ env.FULCIO_URL }}
        REKOR_URL: ${{ env.REKOR_URL }}
        TSA_URL: ${{ env.TSA_URL }}

    - name: Sign with cosign from the action using k8s token
      run: |
        cosign sign --yes --signing-config=signing_config.json --new-bundle-format=true --allow-insecure-registry --allow-http-registry ${DEMOIMAGE} --identity-token ${OIDC_TOKEN}
      env:
        DEMOIMAGE: ${{ env.demoimage }}
        OIDC_TOKEN: ${{ env.OIDC_TOKEN }}

    - name: Verify with cosign from the action using k8s token
      run: |
        cosign verify \
        --allow-insecure-registry --allow-http-registry "${DEMOIMAGE}" \
        --new-bundle-format \
        --use-signed-timestamps \
        --certificate-identity "https://kubernetes.io/namespaces/default/serviceaccounts/default" \
        --certificate-oidc-issuer "https://kubernetes.default.svc.cluster.local"
      env:
        DEMOIMAGE: ${{ env.demoimage }}

    - name: Build timestamp-cli
      working-directory: ./src/github.com/sigstore/timestamp-authority
      run: |
        go build -o ./timestamp-cli ./cmd/timestamp-cli
    - name: Exercise TSA
      working-directory: ./src/github.com/sigstore/timestamp-authority
      run: |
        curl ${TSA_URL}/api/v1/timestamp/certchain > ts_chain.pem
        echo "myblob" > myblob
        if ! ./timestamp-cli --timestamp_server ${TSA_URL} timestamp --hash sha256 --artifact myblob --out response.tsr ; then
          echo "failed to timestamp artifact"
          exit -1
        fi
        if ! ./timestamp-cli verify --timestamp response.tsr --artifact "myblob" --certificate-chain ts_chain.pem ; then
          echo "failed to verify timestamp"
          exit -1
        fi
        if ! ./timestamp-cli inspect --timestamp response.tsr --format json ; then
          echo "failed to inspect the timestamp"
          exit -1
        fi
      env:
        TSA_URL: ${{ env.TSA_URL }}

    - name: Collect diagnostics
      if: ${{ failure() }}
      uses: chainguard-dev/actions/kind-diag@f45211d3e8f9d2676c6b8cdd6a765435e06c819d # v1.6.13
