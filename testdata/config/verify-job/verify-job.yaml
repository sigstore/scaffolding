---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-job
spec:
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # We use an init container to run cosign initialize in the main
      # container. Note that in order for the initialize to then "stick" for
      # the main container, we mount an empty dir where the tuf root then
      # gets initialized and will be used by the main container.
      initContainers:
      - name: cosign-initialize
        image: ghcr.io/sigstore/cosign/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8 # cosign v3.1.3
        args: [
          "initialize",
          "--mirror", "http://tuf.tuf-system.svc",
          "--root", "/var/run/tuf/root.json",
        ]
        env:
        - name: HOME
          value: "/var/run/sigstore"
        volumeMounts:
        - name: tuf-root
          mountPath: "/var/run/tuf"
          readOnly: true
        - name: homedir
          mountPath: "/var/run/sigstore"
      containers:
      - name: cosign
        image: ghcr.io/sigstore/cosign/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8 # cosign v3.1.3
        args: [
          "verify",
          "--allow-http-registry",
          "--certificate-identity=https://kubernetes.io/namespaces/default/serviceaccounts/default",
          "--certificate-oidc-issuer=https://kubernetes.default.svc.cluster.local",
          "ko://github.com/sigstore/scaffolding/tools/getoidctoken/cmd/getoidctoken",
        ]
        env:
        - name: HOME
          value: "/var/run/sigstore"
        volumeMounts:
        - name: oidc-info
          mountPath: /var/run/sigstore/cosign
        - name: homedir
          mountPath: "/var/run/sigstore"
      volumes:
        # Create emptydir so the root from initialize is available to sign
        - name: homedir
          emptyDir: {}
        - name: oidc-info
          projected:
            sources:
              - serviceAccountToken:
                  path: oidc-token
                  expirationSeconds: 600 # Use as short-lived as possible.
                  audience: sigstore
        - name: tuf-root
          secret:
            secretName: tuf-root
            items:
            - key: root
              path: root.json
